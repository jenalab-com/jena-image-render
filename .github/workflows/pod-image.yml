name: pod-image
# Builds the RunPod image from pod/. Tag a release `pod-v1`, `pod-v2`, ...
on:
  push:
    tags: ["pod-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests && cd pod && python -m unittest discover -s tests -v
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jena-image-render-pod
          tags: |
            type=match,pattern=pod-(v.*),group=1
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: pod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
