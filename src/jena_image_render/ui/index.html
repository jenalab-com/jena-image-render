<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jenair-token" content="__JENAIR_TOKEN__">
<title>jenair</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --field: #ffffff; --chip: #eef0f4;
  --line: #d8dce2; --text: #1c2230; --muted: #687080;
  --accent: #2c6bd9; --accent-text: #ffffff; --accent-soft: #e3ecfb;
  --ok: #1d8f4e; --warn: #b86e00; --bad: #cc3636; --idle: #9aa1ad;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161b; --panel: #1a1e25; --field: #11141a; --chip: #252a33;
    --line: #2e343e; --text: #e3e6eb; --muted: #949cab;
    --accent: #5b8eef; --accent-text: #0d1117; --accent-soft: #1f2b42;
    --ok: #3cc47a; --warn: #e3a03c; --bad: #ef6464; --idle: #6b7280;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--chip); border: 1px solid var(--line); border-radius: 5px;
  padding: 3px 9px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.icon { padding: 1px 6px; background: transparent; border-color: transparent; color: var(--muted); }
button.icon:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
button.on { background: var(--accent-soft); border-color: var(--accent); }
input, select, textarea {
  background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 6px; min-width: 0;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -1px;
}
input:disabled, textarea:disabled, select:disabled { opacity: .5; }
input[type=checkbox], input[type=radio] { margin: 0 4px 0 0; vertical-align: -2px; }
textarea { resize: vertical; width: 100%; }
.bad, input.bad, select.bad, textarea.bad { border-color: var(--bad) !important; color: var(--bad); }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

/* main column */
#main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
#top {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
#top .brand { font-weight: 700; margin-right: 8px; letter-spacing: .2px; }
#top .file { margin-left: 10px; color: var(--muted); max-width: 300px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
#top .file b { color: var(--warn); }
#top .spacer { flex: 1; }
#top label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
#output { width: 150px; }
.menu { position: relative; }
.menu .list {
  position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 3px; min-width: 280px;
  max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 4px 0;
}
.menu .list h4 { margin: 6px 10px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
.menu .list button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
  background: transparent; padding: 3px 12px; }
.menu .list button:hover { background: var(--accent-soft); }
#tabbar {
  display: flex; align-items: end; gap: 2px; padding: 8px 14px 0; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.tab {
  display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 8px;
  border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0;
  background: var(--chip); cursor: pointer; margin-bottom: -1px; user-select: none;
}
.tab.on { background: var(--panel); border-color: var(--line); position: relative; }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.tab.off .tname { text-decoration: line-through; color: var(--muted); }
.tab.dragover { border-color: var(--accent); }
.tab .count { font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 0 6px; }
.tab input.rename { width: 120px; padding: 1px 4px; }
.tname.bad { border: 0 !important; }
#tabbar .addtab { margin: 0 0 4px 4px; }
#editor { flex: 1; overflow: auto; padding: 14px 18px 60px; background: var(--panel); }

/* settings */
.grid { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; align-items: start; max-width: 980px; }
.grid > .lab { padding-top: 4px; color: var(--muted); text-align: right; }
.line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.line select.model { max-width: 320px; }
.line input.custom { flex: 1; min-width: 220px; }
.tag { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 10px; padding: 1px 8px; }
.loras { display: flex; flex-direction: column; gap: 4px; }
.lora { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lora select { max-width: 240px; }
.lora input.custom { width: 220px; }
.lora input.scale { width: 64px; }
.lora input.trigger { width: 170px; }
.num { width: 76px; }
.mid { width: 150px; }
#negative { min-height: 30px; }
details.extra summary { cursor: pointer; color: var(--muted); }
details.extra textarea { margin-top: 4px; font: 12px ui-monospace, Menlo, monospace; min-height: 60px; }
.prompts-head { display: flex; align-items: center; gap: 8px; margin: 22px 0 8px; max-width: 980px;
  border-top: 1px solid var(--line); padding-top: 12px; }
.prompts-head h3 { margin: 0; font-size: 13px; }
.prompts-head .spacer { flex: 1; }
.prompt { display: grid; grid-template-columns: auto 120px minmax(0, 1fr) auto; gap: 6px; align-items: start;
  max-width: 980px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.prompt.off textarea, .prompt.off .pname { opacity: .5; }
.prompt > input[type=checkbox] { margin-top: 7px; }
.prompt textarea.text { min-height: 30px; overflow: hidden; resize: none; line-height: 1.4; }
.prompt .acts { display: flex; gap: 0; }
.prompt .acts button.has { color: var(--accent); }
.prompt .over { grid-column: 2 / 5; }
.prompt .over textarea { font: 12px ui-monospace, Menlo, monospace; min-height: 54px; }
.empty { color: var(--muted); padding: 20px 0; }

/* side */
#side { height: 100vh; overflow: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: 10px 14px 30px; display: flex; flex-direction: column; gap: 10px; }
#side h2 { margin: 2px 0 0; font-size: 12px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
#side section { border: 1px solid var(--line); border-radius: 7px; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
#side label.blk { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
#side label.blk input { color: var(--text); }
.seg { display: flex; gap: 14px; }
.seg label { cursor: pointer; }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.connecting { background: var(--warn); } .dot.ready { background: var(--ok); } .dot.error { background: var(--bad); }
#connMsg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.big { font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { height: 7px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.bar.thin { height: 4px; }
.phases { display: flex; gap: 4px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.phases span.now { color: var(--text); font-weight: 600; }
.phases span.past { color: var(--ok); }
.list-s { margin: 0; padding-left: 16px; overflow-wrap: anywhere; }
.list-s li { margin: 1px 0; }
.errors li { color: var(--bad); } .warnings li { color: var(--warn); }
.ftable { width: 100%; border-collapse: collapse; font-size: 12px; }
.ftable td { padding: 1px 4px 1px 0; vertical-align: top; overflow-wrap: anywhere; }
.ftable td.how { white-space: nowrap; color: var(--muted); }
#thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
#thumbs a { display: block; aspect-ratio: 1; background: var(--chip); border-radius: 4px; overflow: hidden; }
#thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
#logBox summary { cursor: pointer; color: var(--muted); }
#log { max-height: 280px; overflow: auto; font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 6px; margin: 6px 0 0; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
#modal[hidden] { display: none; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; width: min(640px, 92vw); display: flex; flex-direction: column; gap: 8px; }
#modal textarea { min-height: 260px; }
.dialog { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.dialog[hidden] { display: none; }
.dialog .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
  width: min(760px, 94vw); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.row2.end { justify-content: flex-end; }
.setrow { display: flex; flex-direction: column; gap: 3px; padding: 6px 0; border-top: 1px solid var(--line); }
.setrow .setlab { font-weight: 600; }
.setrow input:not([type]), .setrow input[type=password], .setrow select { flex: 1; min-width: 200px; }
.setrow > .tag { align-self: flex-start; }
.tag.oktag { color: var(--ok); }
.ok { color: var(--ok); } .warnline { color: var(--warn); }
.browse { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; min-height: 340px; }
.browse .places { display: flex; flex-direction: column; gap: 2px; overflow: auto; max-height: 52vh; }
.browse .places button { text-align: left; overflow: hidden; text-overflow: ellipsis; }
.browse .main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0; }
.crumbs button.icon { color: var(--accent); padding: 1px 3px; }
.entries { border: 1px solid var(--line); border-radius: 5px; overflow: auto; max-height: 44vh; min-height: 240px; }
.entry { padding: 3px 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.entry:hover { background: var(--chip); }
.entry.on { background: var(--accent-soft); }
.entry.dir { color: var(--muted); }
#noKey button { margin-left: 4px; }
@media (max-width: 600px) { .browse { grid-template-columns: 1fr; } .browse .places { flex-direction: row; flex-wrap: wrap; } }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--panel);
  padding: 6px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: .92; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; overflow: auto; height: auto; }
  #main, #side { height: auto; }
  #editor { overflow: visible; }
  .grid { grid-template-columns: 1fr; } .grid > .lab { text-align: left; padding: 0; }
  .prompt { grid-template-columns: auto minmax(0, 1fr) auto; } .prompt .pname { grid-column: 2; }
  .prompt textarea.text { grid-column: 1 / 4; } .prompt .over { grid-column: 1 / 4; }
}
</style>
</head>
<body>
<div id="main">
  <header id="top">
    <span class="brand">jenair</span>
    <button id="newBtn" data-t="new"></button>
    <div class="menu"><button id="openBtn"></button><div class="list" id="openList" hidden></div></div>
    <button id="saveBtn" data-t="save"></button>
    <button id="saveAsBtn" data-t="saveAs"></button>
    <button id="importBtn" data-t="import"></button>
    <button id="exportBtn" data-t="export"></button>
    <span class="file" id="fileLabel"></span>
    <span class="spacer"></span>
    <label><span data-t="output"></span><input id="output" spellcheck="false"></label>
    <button id="settingsBtn" title="Settings"></button>
    <button id="langBtn" class="icon"></button>
  </header>
  <nav id="tabbar"></nav>
  <section id="editor"></section>
</div>
<aside id="side">
  <h2 data-t="renderTitle"></h2>
  <section>
    <div class="seg">
      <label><input type="radio" name="target" value="local"><span data-t="local"></span></label>
      <label><input type="radio" name="target" value="runpod"><span data-t="runpod"></span></label>
    </div>
    <div id="localOpts">
      <label class="blk"><span data-t="comfyUrl"></span><input id="comfyUrl" spellcheck="false"></label>
    </div>
    <div id="podOpts">
      <div class="row2">
        <label><span data-t="maxHours"></span> <input id="maxHours" class="num" type="number" min="0.25" max="24" step="0.25" value="3"></label>
        <label><input type="checkbox" id="secure"><span data-t="secure"></span></label>
      </div>
      <p class="hint" id="noKey" hidden></p>
    </div>
    <div class="row2">
      <button id="connectBtn" class="primary" data-t="connect"></button>
      <button id="disconnectBtn" hidden></button>
      <span class="dot" id="dot"></span><span id="connMsg" class="muted"></span>
    </div>
    <div id="connDetail"></div>
  </section>
  <section>
    <div id="summary" class="big"></div>
    <div class="row2">
      <label><input type="checkbox" id="overwrite"><span data-t="overwrite"></span></label>
      <label><input type="checkbox" id="keepGoing"><span data-t="keepGoing"></span></label>
    </div>
    <div class="row2">
      <button id="checkBtn" data-t="check"></button>
      <button id="renderBtn" class="primary"></button>
      <button id="cancelBtn" data-t="cancel" hidden></button>
    </div>
    <div id="checkOut"></div>
    <div id="progress"></div>
    <div id="thumbs"></div>
  </section>
  <details id="logBox"><summary data-t="log"></summary><pre id="log"></pre></details>
</aside>
<div id="modal" hidden>
  <div class="box">
    <b id="modalTitle"></b>
    <span class="hint" id="modalHint"></span>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="row2"><span class="spacer" style="flex:1"></span><button id="modalCancel" data-t="cancel"></button><button id="modalOk" class="primary" data-t="add"></button></div>
  </div>
</div>
<div id="settingsBox" class="dialog" hidden><div class="box wide"></div></div>
<div id="browser" class="dialog" hidden><div class="box wide"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<datalist id="dlSamplers"></datalist>
<datalist id="dlSchedulers"></datalist>
<script id="convert">
// Job JSON <-> the page's tabs. Pure functions (no page access), so they also
// run under Node in the test suite. The rules mirror config.expand: a batch's
// defaults are the top-level defaults with the batch's laid over them, and a
// layer that names a seed or a size key replaces that whole group.
var JenairConvert = (function () {
  "use strict";
  var GROUPS = [["seed", "seeds"], ["aspect", "width", "height"]];
  var TOP = ["version", "target", "output", "defaults", "jobs", "batches"];

  function isObject(v) {
    return v !== null && typeof v === "object" && !Array.isArray(v);
  }
  function copy(v) {
    return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  }
  function has(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }
  function isInt(v) {
    return typeof v === "number" && isFinite(v) && Math.floor(v) === v;
  }

  // `over` laid on `base`: values replace as a whole, as do the GROUPS.
  function layer(base, over) {
    var merged = copy(base) || {};
    GROUPS.forEach(function (group) {
      if (group.some(function (k) { return has(over, k); })) {
        group.forEach(function (k) { delete merged[k]; });
      }
    });
    Object.keys(over).forEach(function (k) { merged[k] = copy(over[k]); });
    return merged;
  }

  function blankSettings() {
    return {
      model: "", loras: [], negative: "",
      size: { mode: "default", aspect: "", width: "", height: "" },
      seeds: [], steps: null, cfg: null, sampler: "", scheduler: ""
    };
  }

  // A LoRA entry → a row. `trigger` null means "the LoRA's own"; anything the
  // page cannot show is kept as it was (`raw`).
  function loraRow(item) {
    if (typeof item === "string") {
      return { name: item, scale: null, trigger: null, extra: {} };
    }
    if (isObject(item) && typeof item.name === "string" && item.name &&
        (item.scale == null || typeof item.scale === "number") &&
        (item.trigger == null || typeof item.trigger === "string")) {
      var extra = {};
      Object.keys(item).forEach(function (k) {
        if (k !== "name" && k !== "scale" && k !== "trigger") extra[k] = copy(item[k]);
      });
      return {
        name: item.name,
        scale: item.scale == null ? null : item.scale,
        trigger: item.trigger == null ? null : item.trigger,
        extra: extra
      };
    }
    return { raw: copy(item) };
  }

  function loraOut(row) {
    if (has(row, "raw")) return copy(row.raw);
    var extra = row.extra || {};
    if (row.scale == null && row.trigger == null && !Object.keys(extra).length) {
      return row.name;
    }
    var out = copy(extra);
    out.name = row.name;
    if (row.scale != null) out.scale = row.scale;
    if (row.trigger != null) out.trigger = row.trigger;
    return out;
  }

  // Defaults → what the tab's fields show, and the rest (kept as it was).
  function splitDefaults(d) {
    var s = blankSettings();
    var extra = {};
    var taken = {};
    function take(k) { taken[k] = true; }

    if (has(d, "model")) {
      if (d.model !== null) s.model = copy(d.model);
      else extra.model = null;
      take("model");
    }
    if (has(d, "loras")) {
      if (Array.isArray(d.loras)) s.loras = d.loras.map(loraRow);
      else if (d.loras !== null) extra.loras = copy(d.loras);
      take("loras");
    }
    if (has(d, "negative")) {
      if (typeof d.negative === "string") s.negative = d.negative;
      else if (d.negative !== null) extra.negative = copy(d.negative);
      take("negative");
    }
    var hasAspect = has(d, "aspect"), hasW = has(d, "width"), hasH = has(d, "height");
    if (hasAspect && !hasW && !hasH && typeof d.aspect === "string") {
      s.size = { mode: "aspect", aspect: d.aspect, width: "", height: "" };
      take("aspect");
    } else if (!hasAspect && hasW && hasH && isInt(d.width) && isInt(d.height)) {
      s.size = { mode: "custom", aspect: "", width: d.width, height: d.height };
      take("width"); take("height");
    }
    var hasSeed = has(d, "seed"), hasSeeds = has(d, "seeds");
    if (hasSeed && !hasSeeds && isInt(d.seed)) {
      s.seeds = [d.seed];
      take("seed");
    } else if (hasSeeds && !hasSeed && Array.isArray(d.seeds) && d.seeds.length &&
               d.seeds.every(isInt)) {
      s.seeds = d.seeds.slice();
      take("seeds");
    } else if (hasSeeds && !hasSeed && isInt(d.seeds)) {
      s.seeds = [d.seeds];
      take("seeds");
    }
    ["steps", "cfg"].forEach(function (k) {
      if (!has(d, k)) return;
      if (typeof d[k] === "number") s[k] = d[k];
      else if (d[k] !== null) extra[k] = copy(d[k]);
      take(k);
    });
    ["sampler", "scheduler"].forEach(function (k) {
      if (!has(d, k)) return;
      if (typeof d[k] === "string" && d[k]) s[k] = d[k];
      else if (d[k] !== null) extra[k] = copy(d[k]);
      take(k);
    });
    Object.keys(d).forEach(function (k) {
      if (!taken[k]) extra[k] = copy(d[k]);
    });
    return { settings: s, extra: extra };
  }

  // One batch (name, merged defaults, jobs) → a tab.
  function tabOf(name, defaults, jobs, skip, batchExtra) {
    var d = copy(defaults) || {};
    var prompts = (jobs || []).map(function (job, i) {
      if (!isObject(job)) return { name: "job" + (i + 1), prompt: "", skip: false,
                                    overrides: {}, raw: copy(job) };
      var name = has(job, "name") ? job.name : d.name;
      var prompt = has(job, "prompt") ? job.prompt : d.prompt;
      var skipped = has(job, "skip") ? job.skip : d.skip;
      var overrides = {};
      Object.keys(job).forEach(function (k) {
        if (k !== "name" && k !== "prompt" && k !== "skip") overrides[k] = copy(job[k]);
      });
      if (prompt != null && typeof prompt !== "string") {
        overrides.prompt = copy(prompt);
        prompt = "";
      }
      return {
        name: name ? String(name) : "job" + (i + 1),
        prompt: prompt == null ? "" : prompt,
        skip: !!skipped,
        overrides: overrides
      };
    });
    delete d.name;
    delete d.prompt;
    delete d.skip;
    var split = splitDefaults(d);
    return {
      name: String(name), skip: !!skip, settings: split.settings, extra: split.extra,
      batchExtra: batchExtra || {}, prompts: prompts
    };
  }

  // Any job file → {target, output, extra, tabs}.
  function importProject(data) {

  // ── file browser: pick a weight file on this computer ───────────────
  var BROWSE = null;
  function openBrowser(kind, t_, done) {
    var eng = oneEngine(tabEngines(t_));
    BROWSE = {
      kind: kind, done: done, data: null, chosen: "", filter: "",
      onlyEngine: kind === "loras" && !!eng, engine: eng ? eng.name : "",
      modelKind: eng && eng.name !== "illustrious" ? "diffusion_models" : "checkpoints",

  }
  function browseKind() { return BROWSE.kind === "loras" ? "loras" : BROWSE.modelKind; }
  function browseTo(path) {
    api("GET", "/api/browse?kind=" + browseKind() + "&path=" + encodeURIComponent(path || ""))
      .then(function (data) {
        BROWSE.data = data;
        BROWSE.chosen = "";
        if (data.ok) store.set("jenair.browse." + BROWSE.kind, data.path);
        renderBrowser();
      }).catch(function (e) {
        if (path) { browseTo(""); return; }  // a remembered folder that is gone
        alert(e.message);
      });

  function joinPath(dir, name) {
    var sep = dir.indexOf("\\") >= 0 && dir.charAt(0) !== "/" ? "\\" : "/";
    return dir.charAt(dir.length - 1) === sep ? dir + name : dir + sep + name;
  }
  function crumbs(path) {
    var win = path.indexOf("\\") >= 0 && path.charAt(0) !== "/";
    var sep = win ? "\\" : "/";
    var parts = path.split(sep).filter(Boolean);
    var out = [];
    var acc = win ? "" : "/";
    if (!win) out.push({ name: "/", path: "/" });
    parts.forEach(function (part, i) {
      acc = win && i === 0 ? part + "\\" : joinPath(acc, part);
      out.push({ name: part, path: acc });
    });
    return out;
  }
  function renderBrowser() {

    }));
